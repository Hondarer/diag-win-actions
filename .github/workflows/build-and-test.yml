name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCppCoverage
        run: |
          Write-Host "Installing OpenCppCoverage..."
          choco install opencppcoverage -y

          # PATH に追加 (GitHub Actions の永続化メカニズムを使用)
          $opencppPath = "C:\Program Files\OpenCppCoverage"
          if (Test-Path $opencppPath) {
              Write-Host "`nAdding OpenCppCoverage to PATH..."
              Add-Content -Path $env:GITHUB_PATH -Value $opencppPath
              Write-Host "PATH addition completed."
          } else {
              Write-Host "ERROR: OpenCppCoverage installation directory not found at $opencppPath"
              exit 1
          }
        shell: pwsh

      - name: Debug - Verify CC environment variable in bash (before Setup MSVC environment)
        run: |
          echo "=== Hypothesis: bash sets CC=cc automatically ==="
          echo ""
          echo "--- PowerShell environment (before bash) ---"
          Write-Host "CC in PowerShell: $env:CC"
          Write-Host "CXX in PowerShell: $env:CXX"
          Write-Host "LD in PowerShell: $env:LD"
          Write-Host "AR in PowerShell: $env:AR"
        shell: pwsh

      - name: Debug - Check CC in bash (before Setup MSVC environment)
        run: |
          echo "=== bash environment (after bash starts) ==="
          echo "CC in bash: $CC"
          echo "CXX in bash: $CXX"
          echo "LD in bash: $LD"
          echo "AR in bash: $AR"
          echo ""
          echo "=== All environment variables containing 'CC' ==="
          env | grep -i "^CC" || echo "No CC-related variables found"
          echo ""
          echo "=== All environment variables containing compiler/linker names ==="
          env | grep -iE "^(CC|CXX|LD|AR|GCC|CLANG)=" || echo "No compiler/linker variables found"
        shell: bash

      - name: Setup MSVC environment
        run: |
          Write-Host "Setting up MSVC environment..."
          & "${{ github.workspace }}\.github\workflows\Add-VSBT-Env-x64.ps1"
        shell: pwsh

      - name: Verify environment
        run: |
          Write-Host "=== MSVC Environment Variables ==="
          Write-Host "VCToolsVersion: $env:VCToolsVersion"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host ""
          Write-Host "=== Makefile Tool Variables ==="
          Write-Host "CC: $env:CC"
          Write-Host "CXX: $env:CXX"
          Write-Host "LD: $env:LD"
          Write-Host "AR: $env:AR"
          Write-Host ""
          Write-Host "=== Checking cl.exe ==="
          $clPath = (Get-Command cl.exe).Source
          Write-Host "cl.exe path: $clPath"
          cl.exe 2>&1 | Select-Object -First 5
          Write-Host ""
          Write-Host "=== Checking make ==="
          $makePath = (Get-Command make.exe).Source
          Write-Host "make.exe path: $makePath"
          make --version
          Write-Host ""
          Write-Host "=== Checking OpenCppCoverage ==="
          $ocpPath = (Get-Command OpenCppCoverage.exe).Source
          Write-Host "OpenCppCoverage.exe path: $ocpPath"
          Write-Host "OpenCppCoverage version:"
          & OpenCppCoverage.exe --help 2>&1 | Select-Object -First 5
          $LASTEXITCODE = 0  # exit code をリセット (--help は exit code 1 を返す)
        shell: pwsh

      - name: Debug - Verify CC environment variable in bash
        run: |
          echo "=== Hypothesis: bash sets CC=cc automatically ==="
          echo ""
          echo "--- PowerShell environment (before bash) ---"
          Write-Host "CC in PowerShell: $env:CC"
          Write-Host "CXX in PowerShell: $env:CXX"
          Write-Host "LD in PowerShell: $env:LD"
          Write-Host "AR in PowerShell: $env:AR"
        shell: pwsh

      - name: Debug - Check CC in bash
        run: |
          echo "=== bash environment (after bash starts) ==="
          echo "CC in bash: $CC"
          echo "CXX in bash: $CXX"
          echo "LD in bash: $LD"
          echo "AR in bash: $AR"
          echo ""
          echo "=== All environment variables containing 'CC' ==="
          env | grep -i "^CC" || echo "No CC-related variables found"
          echo ""
          echo "=== All environment variables containing compiler/linker names ==="
          env | grep -iE "^(CC|CXX|LD|AR|GCC|CLANG)=" || echo "No compiler/linker variables found"
        shell: bash

      - name: Build with make
        run: |
          make
        shell: pwsh

      - name: Run testmain.exe
        run: |
          Write-Host "`n=== Running testmain.exe ==="
          $testmainPath = "prod\testmain\testmain.exe"

          if (Test-Path $testmainPath) {
              Write-Host "Executing $testmainPath..."
              & $testmainPath

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "`ntest main execution completed successfully (exit code: 0)"
              } else {
                  Write-Host "`nERROR: testmain.exe failed with exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          } else {
              Write-Host "ERROR: testmain.exe not found at $testmainPath"
              exit 1
          }
        shell: pwsh
