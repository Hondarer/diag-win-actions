name: Windows Runner Environment Diagnostics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  environment-survey:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup VSBT environment
        shell: pwsh
        run: |
          Write-Host "=== Setting up VSBT Environment ===" -ForegroundColor Green
          & "$env:GITHUB_WORKSPACE\.github\workflows\Add-VSBT-Env-x64.ps1"

      - name: System information
        shell: pwsh
        run: |
          Write-Host "=== System Information ===" -ForegroundColor Green
          Get-ComputerInfo | Select-Object CsName, WindowsVersion, OsArchitecture, OsLanguage
          Write-Host "`n=== PowerShell Version ===" -ForegroundColor Green
          $PSVersionTable

      - name: Environment variables
        shell: pwsh
        run: |
          Write-Host "=== Environment Variables ===" -ForegroundColor Green
          Get-ChildItem env: | Sort-Object Name | Format-Table -AutoSize

      - name: PATH analysis
        shell: pwsh
        run: |
          Write-Host "=== PATH Environment Variable ===" -ForegroundColor Green
          $env:PATH -split ';' | ForEach-Object { Write-Host $_ }

      - name: Git installation check
        shell: pwsh
        run: |
          Write-Host "=== Git Installation ===" -ForegroundColor Green
          git --version
          $gitPath = (Get-Command git).Source
          Write-Host "Git executable: $gitPath"

          $gitRoot = Split-Path (Split-Path $gitPath)
          Write-Host "Git root: $gitRoot"

          $mingwPath = Join-Path $gitRoot "mingw64\bin"
          $usrPath = Join-Path $gitRoot "usr\bin"

          Write-Host "`nMinGW path: $mingwPath"
          Write-Host "MinGW exists: $(Test-Path $mingwPath)"

          Write-Host "`nusr/bin path: $usrPath"
          Write-Host "usr/bin exists: $(Test-Path $usrPath)"

          if (Test-Path $mingwPath) {
            Write-Host "`nMinGW binaries (first 20):"
            Get-ChildItem $mingwPath -File | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
          }

      - name: Visual Studio and MSVC check
        shell: pwsh
        run: |
          Write-Host "=== Visual Studio Installation ===" -ForegroundColor Green

          # vswhere を使用して VS インストール情報を取得
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host "VS installations:"
            & $vswhere -all -prerelease -property installationPath

            Write-Host "`nVS detailed info:"
            & $vswhere -all -prerelease
          }

          # MSVC コンパイラの確認
          Write-Host "`n=== MSVC Compiler ===" -ForegroundColor Green
          $clPath = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($clPath) {
            Write-Host "cl.exe found: $($clPath.Source)"
            cl.exe 2>&1 | Select-Object -First 5
          } else {
            Write-Host "cl.exe not found in PATH"
          }

          # VSBT 環境変数の確認
          Write-Host "`n=== VSBT Environment Variables ===" -ForegroundColor Green
          Write-Host "VCToolsVersion: $env:VCToolsVersion"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"
          Write-Host "WindowsSdkBinPath: $env:WindowsSdkBinPath"

          # MSVC 14.44.35207 の確認
          Write-Host "`n=== MSVC 14.44.35207 Check ===" -ForegroundColor Green
          $msvcPath = "$env:VCToolsInstallDir\bin\Hostx64\x64"
          if (Test-Path $msvcPath) {
            Write-Host "MSVC 14.44.35207 path exists: $msvcPath"
            Write-Host "Binaries (first 10):"
            Get-ChildItem $msvcPath -File | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "MSVC 14.44.35207 path not found: $msvcPath"
          }

      - name: Windows SDK check
        shell: pwsh
        run: |
          Write-Host "=== Windows SDK ===" -ForegroundColor Green

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (Test-Path $sdkRoot) {
            Write-Host "Windows SDK root: $sdkRoot"

            $includePath = Join-Path $sdkRoot "Include"
            $libPath = Join-Path $sdkRoot "Lib"
            $binPath = Join-Path $sdkRoot "bin"

            if (Test-Path $includePath) {
              Write-Host "`nAvailable SDK versions (Include):"
              Get-ChildItem $includePath -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            }

            if (Test-Path $libPath) {
              Write-Host "`nAvailable SDK versions (Lib):"
              Get-ChildItem $libPath -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            }

            if (Test-Path $binPath) {
              Write-Host "`nAvailable SDK versions (Bin):"
              Get-ChildItem $binPath -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            }
          } else {
            Write-Host "Windows SDK not found at $sdkRoot"
          }

          # Windows SDK 10.0.26100.0 の確認
          Write-Host "`n=== Windows SDK 10.0.26100.0 Check ===" -ForegroundColor Green
          $sdk26100Bin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64"
          $sdk26100Include = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          $sdk26100Lib = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\10.0.26100.0"

          if (Test-Path $sdk26100Bin) {
            Write-Host "SDK 10.0.26100.0 bin exists: $sdk26100Bin"
            Write-Host "Binaries (first 10):"
            Get-ChildItem $sdk26100Bin -File | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "SDK 10.0.26100.0 bin not found: $sdk26100Bin"
          }

          if (Test-Path $sdk26100Include) {
            Write-Host "`nSDK 10.0.26100.0 include exists: $sdk26100Include"
            Write-Host "Include directories:"
            Get-ChildItem $sdk26100Include -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "`nSDK 10.0.26100.0 include not found: $sdk26100Include"
          }

          if (Test-Path $sdk26100Lib) {
            Write-Host "`nSDK 10.0.26100.0 lib exists: $sdk26100Lib"
            Write-Host "Lib directories:"
            Get-ChildItem $sdk26100Lib -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "`nSDK 10.0.26100.0 lib not found: $sdk26100Lib"
          }

      - name: Installed programs check
        shell: pwsh
        run: |
          Write-Host "=== Installed Programs ===" -ForegroundColor Green

          # chocolatey でインストールされたツール
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            Write-Host "Chocolatey version:"
            choco --version
          }

          # その他の開発ツール
          Write-Host "`n=== Development Tools ===" -ForegroundColor Green
          $tools = @('cmake', 'ninja', 'make', 'gcc', 'g++', 'clang')
          foreach ($tool in $tools) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "$tool : $($cmd.Source)"
            } else {
              Write-Host "$tool : Not found"
            }
          }

      - name: Disk and directory structure
        shell: pwsh
        run: |
          Write-Host "=== Disk Information ===" -ForegroundColor Green
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

          Write-Host "`n=== Runner workspace ===" -ForegroundColor Green
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "Current directory: $(Get-Location)"

          Write-Host "`nWorkspace contents:"
          Get-ChildItem $env:GITHUB_WORKSPACE -Force

      - name: Test sample scripts availability
        shell: pwsh
        run: |
          Write-Host "=== Sample Scripts Check ===" -ForegroundColor Green

          $sampleDir = Join-Path $env:GITHUB_WORKSPACE "sample"
          if (Test-Path $sampleDir) {
            Write-Host "Sample directory contents:"
            Get-ChildItem $sampleDir | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "Sample directory not found"
          }
