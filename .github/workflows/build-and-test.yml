name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCppCoverage
        run: |
          Write-Host "Installing OpenCppCoverage..."
          choco install opencppcoverage -y

          # PATH に追加 (GitHub Actions の永続化メカニズムを使用)
          $opencppPath = "C:\Program Files\OpenCppCoverage"
          if (Test-Path $opencppPath) {
              Write-Host "`nAdding OpenCppCoverage to PATH..."
              Add-Content -Path $env:GITHUB_PATH -Value $opencppPath
              Write-Host "PATH addition completed."
          } else {
              Write-Host "ERROR: OpenCppCoverage installation directory not found at $opencppPath"
              exit 1
          }
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Setup MSVC environment
        run: |
          Write-Host "Setting up MSVC environment..."
          & "${{ github.workspace }}\.github\workflows\Add-VSBT-Env-x64.ps1"
        shell: pwsh

      - name: Build
        run: make
        shell: pwsh

      - name: Run prod/prodmain
        run: |
          Write-Host "`n=== Running prod/prodmain ==="
          $prodmainPath = "prod\prodmain\prodmain.exe"

          if (Test-Path $prodmainPath) {
              Write-Host "Executing $prodmainPath..."
              & $prodmainPath

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "`nprodmain.exe execution completed successfully (exit code: 0)"
              } else {
                  Write-Host "`nERROR: prodmain.exe failed with exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          } else {
              Write-Host "ERROR: prodmain.exe not found at $prodmainPath"
              exit 1
          }
        shell: pwsh

      - name: Test
        run: make test
        shell: pwsh
