name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCppCoverage
        run: |
          Write-Host "Installing OpenCppCoverage..."
          choco install opencppcoverage -y

          # PATH に追加 (GitHub Actions の永続化メカニズムを使用)
          $opencppPath = "C:\Program Files\OpenCppCoverage"
          if (Test-Path $opencppPath) {
              Write-Host "`nAdding OpenCppCoverage to PATH..."
              Add-Content -Path $env:GITHUB_PATH -Value $opencppPath
              Write-Host "PATH addition completed."
          } else {
              Write-Host "ERROR: OpenCppCoverage installation directory not found at $opencppPath"
              exit 1
          }
        shell: pwsh

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Setup MSVC environment
        run: |
          Write-Host "Setting up MSVC environment..."
          & "${{ github.workspace }}\.github\workflows\Add-VSBT-Env-x64.ps1"
        shell: pwsh

      - name: Verify environment
        run: |
          Write-Host "=== MSVC Environment Variables ==="
          Write-Host "VCToolsVersion: $env:VCToolsVersion"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host ""
          Write-Host "=== Checking OpenCppCoverage ==="
          $ocpPath = (Get-Command OpenCppCoverage.exe).Source
          Write-Host "OpenCppCoverage.exe path: $ocpPath"
          Write-Host "OpenCppCoverage version:"
          & OpenCppCoverage.exe --help 2>&1 | Select-Object -First 5
          $LASTEXITCODE = 0  # exit code をリセット (--help は exit code 1 を返す)
        shell: pwsh

      - name: Build with make
        run: make
        shell: pwsh

      - name: Run prod/testmain.exe
        run: |
          Write-Host "`n=== Running prod/testmain.exe ==="
          $testmainPath = "prod\testmain\testmain.exe"

          if (Test-Path $testmainPath) {
              Write-Host "Executing $testmainPath..."
              & $testmainPath

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "`ntest main execution completed successfully (exit code: 0)"
              } else {
                  Write-Host "`nERROR: testmain.exe failed with exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          } else {
              Write-Host "ERROR: testmain.exe not found at $testmainPath"
              exit 1
          }
        shell: pwsh

      - name: Run test/testmain.exe
        run: |
          Write-Host "`n=== Running test/testmain.exe ==="
          $testmainPath = "test\testmain\testmain.exe"

          if (Test-Path $testmainPath) {
              Write-Host "Executing $testmainPath..."
              & $testmainPath

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "`ntest main execution completed successfully (exit code: 0)"
              } else {
                  Write-Host "`nERROR: testmain.exe failed with exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
              }
          } else {
              Write-Host "ERROR: testmain.exe not found at $testmainPath"
              exit 1
          }
        shell: pwsh

      - name: Test
        run: make test
        shell: pwsh
